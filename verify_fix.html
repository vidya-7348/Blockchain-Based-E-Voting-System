<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP Fix</title>
</head>
<body>
    <h1>Verify OTP Fix</h1>
    <input type="email" id="email" placeholder="Enter email" value="test@example.com">
    <button onclick="testPostRequest()">Test POST Request (Should Work)</button>
    <button onclick="testGetRequest()">Test GET Request (Should Fail with Clear Message)</button>
    <div id="result"></div>

    <script>
        async function testPostRequest() {
            const email = document.getElementById('email').value;
            const resultDiv = document.getElementById('result');
            
            try {
                console.log('Testing POST request to /otp/send');
                const response = await fetch('/otp/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email: email })
                });
                
                const data = await response.json();
                console.log('POST Response:', data);
                
                if (response.ok) {
                    resultDiv.innerHTML = `<p style="color: green;">✅ POST Success: ${JSON.stringify(data)}</p>`;
                } else {
                    resultDiv.innerHTML = `<p style="color: red;">❌ POST Error: ${response.status} - ${JSON.stringify(data)}</p>`;
                }
            } catch (error) {
                console.error('POST Error:', error);
                resultDiv.innerHTML = `<p style="color: red;">❌ POST Network Error: ${error.message}</p>`;
            }
        }
        
        async function testGetRequest() {
            const email = document.getElementById('email').value;
            const resultDiv = document.getElementById('result');
            
            try {
                console.log('Testing GET request to /otp/send');
                // This should fail with a clear error message
                const response = await fetch(`/otp/send?email=${encodeURIComponent(email)}`, {
                    method: 'GET'
                });
                
                const data = await response.json();
                console.log('GET Response:', data);
                
                if (response.ok) {
                    resultDiv.innerHTML = `<p style="color: green;">✅ GET Success: ${JSON.stringify(data)}</p>`;
                } else {
                    resultDiv.innerHTML = `<p style="color: red;">❌ GET Error: ${response.status} - ${JSON.stringify(data)}</p>`;
                }
            } catch (error) {
                console.error('GET Error:', error);
                resultDiv.innerHTML = `<p style="color: red;">❌ GET Network Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
