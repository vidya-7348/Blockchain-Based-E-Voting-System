<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final OTP Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            font-weight: bold;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .loading {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Final OTP Test</h1>
        <p>This test will send an OTP through the proper proxy setup.</p>
        
        <div class="form-group">
            <label for="email">Email Address:</label>
            <input type="email" id="email" placeholder="Enter your email address">
        </div>
        
        <button id="sendOtpBtn">Send OTP</button>
        
        <div id="result" class="result"></div>
    </div>

    <script>
        document.getElementById('sendOtpBtn').addEventListener('click', async function() {
            const email = document.getElementById('email').value;
            const resultDiv = document.getElementById('result');
            const sendBtn = document.getElementById('sendOtpBtn');
            
            // Validation
            if (!email) {
                showResult('Please enter an email address', 'error');
                return;
            }
            
            // Show loading state
            const originalText = sendBtn.textContent;
            sendBtn.textContent = 'Sending OTP...';
            sendBtn.disabled = true;
            showResult('Sending OTP request...', 'loading');
            
            try {
                console.log('Sending OTP request to:', '/otp/send');
                console.log('Email:', email);
                
                // Make request through proxy
                const response = await fetch('/otp/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email: email })
                });
                
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server error: ${response.status} - ${errorText}`);
                }
                
                const data = await response.json();
                console.log('Response data:', data);
                
                if (data.success) {
                    let message = `✅ OTP sent successfully to ${email}!`;
                    if (data.dev_otp) {
                        message += `<br><br><strong>Development Mode OTP:</strong> ${data.dev_otp}`;
                        message += `<br><em>(This OTP is shown because EMAIL_ENABLED=true and OTP_DEBUG=true)</em>`;
                    }
                    showResult(message, 'success');
                    
                    // Also show alert
                    alert(`OTP sent to ${email}!\n\nDevelopment OTP: ${data.dev_otp}`);
                } else {
                    const errorMessage = data.detail || data.message || 'Unknown error occurred';
                    showResult(`❌ Failed to send OTP: ${errorMessage}`, 'error');
                }
            } catch (error) {
                console.error('Error sending OTP:', error);
                showResult(`❌ Error sending OTP: ${error.message}`, 'error');
            } finally {
                // Restore button state
                sendBtn.textContent = originalText;
                sendBtn.disabled = false;
            }
        });
        
        function showResult(message, type) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = message;
            resultDiv.className = 'result ' + type;
            resultDiv.style.display = 'block';
        }
    </script>
</body>
</html>
