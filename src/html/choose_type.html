<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOTING SYSTEM - Role Selection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        
        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 20px;
            color: #666;
            margin-bottom: 30px;
        }
        
        .role-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .role-btn {
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(66, 133, 244, 0.3);
        }
        
        .role-btn:hover {
            background: #3367d6;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(66, 133, 244, 0.4);
        }
        
        .role-btn:active {
            transform: translateY(0);
        }
        
        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }
            
            .logo {
                font-size: 24px;
            }
            
            .subtitle {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">VOTING SYSTEM</div>
        <div class="subtitle">Select Your Role</div>
        <div class="role-buttons">
            <button class="role-btn" onclick="selectRole('user')">User</button>
            <button class="role-btn" onclick="selectRole('admin')">Admin</button>
        </div>
    </div>
    
    <script>
        function selectRole(role) {
            if (role === 'user') {
                // Always redirect user to registration page first
                // They can go to login page from there if they already have an account
                window.location.href = '/register.html';
            } else if (role === 'admin') {
                // Always redirect admin to admin login page
                window.location.href = '/admin_login.html';
            }
        }
        
        // On page load, check if user is already logged in
        document.addEventListener('DOMContentLoaded', function() {
            // This is just for better UX, actual authentication happens on protected pages
        });
    </script>
</body>
</html>
